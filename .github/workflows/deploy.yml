name: Deploy

# Collects fresh headlines, builds the static site (the static-export branch) and commits it to the
# `deploy` branch under public_html/. Hostinger's Git deployment (hPanel → Advanced → GIT, connected
# with GitHub, branch `deploy`, root directory `public_html`, auto-deployment on) publishes each new
# commit. Turned on by setting the SITE_URL repository variable.
#
# GitHub runs scheduled workflows only from the default branch, so this same file also lives on main:
# from either branch it builds static-export.
on:
  schedule:
    # Hourly. Each run takes ~2 minutes: a private repo's free 2,000 minutes a month cover this;
    # a public repo has no limit, so it could run every 15 minutes ("*/15 * * * *").
    - cron: "7 * * * *"
  push:
    branches: [static-export]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: static-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # First-seen times, source health and logos carry over from run to run.
      - uses: actions/cache@v4
        with:
          path: |
            .data
            public/logos
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      - run: npm run fetch
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # One new commit on top of the last, so the host can always fast-forward.
      - name: Commit the site to the deploy branch
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git clone --quiet --depth 1 --branch deploy "$REPO" site
          else
            git init --quiet -b deploy site
            git -C site remote add origin "$REPO"
          fi
          # Only public_html/ is published; nothing else belongs on the branch.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name public_html -exec rm -rf {} +
          mkdir -p site/public_html
          rsync -a --delete out/ site/public_html/
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Deploy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin deploy
