name: Deploy

# Collects fresh headlines, builds the static site (the static-export branch) and uploads it to Cloudflare
# Pages (project `bartaboard`, serving bartaboard.com). Turned on by setting the SITE_URL repository
# variable; the upload needs the CLOUDFLARE_ACCOUNT_ID variable and the CLOUDFLARE_API_TOKEN secret
# (Pages: Edit).
#
# This same file also lives on main (the outside timer dispatches it there): from either branch it
# builds static-export.
on:
  # Started every 15 minutes by an outside timer (cron-job.org) through GitHub's API:
  #   POST /repos/rhossain/deshboard/actions/workflows/deploy.yml/dispatches  {"ref":"main"}
  # with a fine-grained token limited to this repo's Actions. GitHub's own `schedule` never fired
  # here, and runs late even when it works. Keep UPDATE_EVERY_MS (static-export's
  # src/components/schedule.ts) in step.
  # Pushes don't start it: every run fetches all the news, and extra runs between the timer's make
  # Google News (the fallback for sites that refuse GitHub) turn us away. A push goes live with the
  # next timed run, within 15 minutes; to publish at once: gh workflow run deploy.yml --ref main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: static-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # First-seen times, source health, 30 days of headlines (.data/days) and logos carry over from run
      # to run. Original logos now live in .data/logos (public/logos is made from them); public/logos stays
      # listed because changing the list starts the cache over, and its old files seed .data/logos once.
      # Restored here and saved right after the fetch, not at the end of the job: a failed build or upload
      # would otherwise throw away what this run learned (first-seen times, Google News addresses).
      - uses: actions/cache/restore@v4
        with:
          path: |
            .data
            public/logos
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      # SITE_URL: a day file missing from the cache (see .data/days) is downloaded from the live site.
      # YOUTUBE_API_KEY (optional secret): current view counts for the videos (src/lib/fetchers/youtube-api.ts).
      - run: npm run fetch
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .data
            public/logos
          key: news-data-${{ github.run_id }}
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Paid plans stay hidden until PLANS is `on`; BKASH_NUMBER is the account readers pay to (src/lib/plans.ts).
          NEXT_PUBLIC_PLANS: ${{ vars.PLANS }}
          # GA_ID: Google Analytics 4's measurement ID (G-…); it switches on the cookie question for readers in
          # the EU, UK and Switzerland, as CONSENT `on` does on its own (src/lib/consent.ts).
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_CONSENT: ${{ vars.CONSENT }}
          # The Meta Pixel ("Bartaboard website" dataset), for measuring our own Facebook ads (src/components/MetaPixel.tsx).
          # Public anyway (it is in every page); a META_PIXEL_ID repository variable overrides it, `off` turns it off.
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID != 'off' && (vars.META_PIXEL_ID || '1098005036277817') || '' }}
          NEXT_PUBLIC_BKASH_NUMBER: ${{ vars.BKASH_NUMBER }}
      # Uploads straight from here: Pages' own Git builds would run out at 500 a month. The first run
      # creates the project.
      - name: Upload the site to Cloudflare Pages
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="npx --yes wrangler@4.20.0"
          $WRANGLER pages project list | grep -qw bartaboard \
            || $WRANGLER pages project create bartaboard --production-branch=main
          $WRANGLER pages deploy out --project-name=bartaboard --branch=main --commit-dirty=true
      # The Facebook Page's next post (scripts/post-facebook.ts, docs/facebook-posting.md), after the upload so the
      # short link it posts already works. FB_POSTING: dry (picks, posts nothing: see the run's summary), review
      # (scheduled 45 minutes ahead, to check in Meta Business Suite) or on; unset or off, this is skipped. What was
      # posted carries over in its own cache, apart from the news data's.
      - if: contains(fromJSON('["dry","review","on"]'), vars.FB_POSTING)
        uses: actions/cache/restore@v4
        with:
          path: .social
          key: facebook-posts-${{ github.run_id }}
          restore-keys: facebook-posts-
      - name: Post to the Facebook Page
        if: contains(fromJSON('["dry","review","on"]'), vars.FB_POSTING)
        continue-on-error: true
        run: npm run post:facebook
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FB_POSTING: ${{ vars.FB_POSTING }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ vars.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_SLOTS: ${{ vars.FB_SLOTS }}
      - if: contains(fromJSON('["dry","review","on"]'), vars.FB_POSTING)
        uses: actions/cache/save@v4
        with:
          path: .social
          key: facebook-posts-${{ github.run_id }}
