name: Deploy

# Collects fresh headlines, builds the static site (the static-export branch) and copies it to the
# web host over SSH with rsync, sending only changed files. Turned on by setting the SITE_URL
# repository variable; needs the SSH_PRIVATE_KEY secret, whose public half is added in hPanel →
# Advanced → SSH Access → SSH keys.
#
# GitHub runs scheduled workflows only from the default branch, so this same file also lives on main:
# from either branch it builds static-export.
on:
  schedule:
    # Hourly. Each run takes ~2 minutes: a private repo's free 2,000 minutes a month cover this;
    # a public repo has no limit, so it could run every 15 minutes ("*/15 * * * *").
    - cron: "7 * * * *"
  push:
    branches: [static-export]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# Hostinger SSH details (hPanel → Advanced → SSH Access). Not secret: the key is.
env:
  SSH_HOST: 217.21.91.251
  SSH_PORT: 65002
  SSH_USER: u594404148
  SITE_DIR: domains/deshboard.rshossain.me/public_html
  # The server's own keys (ssh-keyscan), so the upload only ever goes to this server.
  SSH_KNOWN_HOSTS: |
    [217.21.91.251]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINCBLeboRykfSV33A0GzWvnPUPe8V5XDN+6ydXj9H4Om
    [217.21.91.251]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPK2T3/8s4nCvle9JPZVaVe7C4D0hNLz63N/doCdo+LRfhUCX8kCowIfgWPk4r7SaQzM3UaRTPDRsq4s8E3vi3o=

jobs:
  deploy:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: static-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # First-seen times, source health and logos carry over from run to run.
      - uses: actions/cache@v4
        with:
          path: |
            .data
            public/logos
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      - run: npm run fetch
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload to the web host
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Add the SSH_PRIVATE_KEY secret (see the README's Deploy section)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          if ! $SSH "$SSH_USER@$SSH_HOST" test -d "$SITE_DIR"; then
            echo "::error::$SITE_DIR doesn't exist on the server. Folders under domains/:"
            $SSH "$SSH_USER@$SSH_HOST" ls domains || true
            exit 1
          fi
          # --delete removes files the new build no longer has; .well-known holds the host's SSL checks.
          rsync -rlz --checksum --delete --exclude .well-known --exclude .git -e "$SSH" out/ "$SSH_USER@$SSH_HOST:$SITE_DIR/"
