name: Deploy

# Collects fresh headlines, builds the static site (the static-export branch) and commits it to the
# `deploy` branch. Hostinger's Git deployment (hPanel → Advanced → GIT, connected with GitHub, branch
# `deploy`, auto-deployment on) copies the branch into the site's web folder on each new commit, so
# the site's files sit at the top of the branch. Turned on by setting the SITE_URL repository variable.
# The same build also goes to Cloudflare Pages (project `bartaboard`, serving bartaboard.com) once the
# CLOUDFLARE_ACCOUNT_ID variable and the CLOUDFLARE_API_TOKEN secret (Pages: Edit) are set.
#
# This same file also lives on main (the outside timer dispatches it there): from either branch it
# builds static-export.
on:
  # Started every 15 minutes by an outside timer (cron-job.org) through GitHub's API:
  #   POST /repos/rhossain/deshboard/actions/workflows/deploy.yml/dispatches  {"ref":"main"}
  # with a fine-grained token limited to this repo's Actions. GitHub's own `schedule` never fired
  # here, and runs late even when it works. Keep UPDATE_EVERY_MS in src/components/schedule.ts in step.
  workflow_dispatch:
  push:
    branches: [static-export]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: static-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # First-seen times, source health and logos carry over from run to run. Original logos now live in
      # .data/logos (public/logos is made from them); public/logos stays listed because changing the list
      # starts the cache over, and its old files seed .data/logos once.
      - uses: actions/cache@v4
        with:
          path: |
            .data
            public/logos
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      - run: npm run fetch
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Paid plans stay hidden until PLANS is `on`; BKASH_NUMBER is the account readers pay to (src/lib/plans.ts).
          NEXT_PUBLIC_PLANS: ${{ vars.PLANS }}
          NEXT_PUBLIC_BKASH_NUMBER: ${{ vars.BKASH_NUMBER }}
      # One new commit on top of the last, so the host can always fast-forward.
      - name: Commit the site to the deploy branch
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git clone --quiet --depth 1 --branch deploy "$REPO" site
          else
            git init --quiet -b deploy site
            git -C site remote add origin "$REPO"
          fi
          rsync -a --delete --exclude .git out/ site/
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Deploy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin deploy
      # Uploads straight from here: Pages' own Git builds would run out at 500 a month. The first run
      # creates the project.
      - name: Upload the site to Cloudflare Pages
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="npx --yes wrangler@4.20.0"
          $WRANGLER pages project list | grep -qw bartaboard \
            || $WRANGLER pages project create bartaboard --production-branch=main
          $WRANGLER pages deploy out --project-name=bartaboard --branch=main --commit-dirty=true
